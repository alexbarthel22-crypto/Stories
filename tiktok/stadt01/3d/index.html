function render(f){const tg=f/FPS;window.HOOK=window.DBG?new Function("EXPL","SMOKES","FIRES",window.DBG):null;const sc=T.scenes.find(s=>tg>=s[1]&&tg<s[2]);
  sven.root.visible=lea.root.visible=drone.visible=false;aimLaser(V(),V(),false);tanker.visible=true;updSparks(tg,false);scanner.userData.sl.intensity=0;
  FIRES.forEach(x=>updFire(x,tg));SMOKES.forEach(x=>updSmoke(x,tg));EXPL.forEach(e=>updExpl(e,tg));if(window.HOOK)window.HOOK(EXPL,SMOKES,FIRES);updShards(tg);
  drone.userData.rot.forEach((r,i)=>r.rotation.y=tg*60+i);drone.userData.el.intensity=2+1.5*Math.sin(tg*12);
  tankerFire.gq.visible=tg>31.6;tankerSmoke.gq.visible=tg>31.8;
  let black=!sc;
  if(sc){const [id,st,en]=sc;SC[id](tg-st,en-st,tg);if(['09','10','11'].includes(id))updSparks(tg,true);
    const [sx,sy]=shakeOff(tg);cam.rotateX(sy);cam.rotateY(sx);
    let fl=0;for(const [t0,d] of T.flashes){if(tg>=t0&&tg<t0+d*1.6)fl=Math.max(fl,.85*(1-(tg-t0)/(d*1.6)))}fish.uniforms.flash.value=fl;fish.uniforms.time.value=tg;
    const fadeIn=tg-st<.1&&st>0?1-(tg-st)/.1:0;fish.uniforms.tint.value.set(-fadeIn,-fadeIn,-fadeIn);
    const q=new THREE.Vector3();BILL.forEach(m=>{m.getWorldPosition(q);m.rotation.y=Math.atan2(cam.position.x-q.x,cam.position.z-q.z)});composer.render()}
  else{renderer.setClearColor(0x000000);renderer.clear()}
  // overlay text
  g.clearRect(0,0,1080,1920);
  for(const [a,b,txt,radio] of T.subs){if(tg>=a&&tg<=b+.15){const ls=wrap(txt,22),pop=1+.12*Math.max(0,1-(tg-a)/.12);ls.forEach((l,j)=>text(l,1920*.66+j*82,62*pop,radio?'#FFE14D':'#fff',14))}}
  const end=T.scenes[T.scenes.length-1][2];
  if(tg>end+.2)text('TEIL 2 MORGEN',1920*.44,100,'#FF3B30',12);
  if(tg>end+.8){text('Glaubt ihr Lea?',1920*.52,62,'#fff',10);text('Schreibt es in die Kommentare',1920*.565,46,'#fff',8)}}
function wrap(txt,n){const w=txt.split(' '),out=[];let cur='';for(const x of w){if((cur+' '+x).trim().length>n){out.push(cur.trim());cur=x}else cur+=' '+x}if(cur.trim())out.push(cur.trim());return out}
function text(s,y,size,col,bw){g.font=`${size}px F`;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=bw;g.strokeStyle='#000';g.strokeText(s,540,y);g.fillStyle=col;g.fillText(s,540,y)}
window.init=async()=>{T=await (await fetch('../timeline.json')).json();await document.fonts.load('60px F');return Math.ceil(T.total*FPS)};
