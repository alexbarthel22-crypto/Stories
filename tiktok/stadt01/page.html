<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:F;src:url("font.otf")}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,FPS=30,IW=768,IH=1376;
const cv=document.getElementById('c'),g=cv.getContext('2d');
let T=null;const IMG={};
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function ease(x){x=clamp(x,0,1);return x*x*(3-2*x)}
async function init(){
  T=await (await fetch('timeline.json')).json();
  await Promise.all(T.scenes.map(s=>new Promise(r=>{const im=new Image();im.onload=r;im.src='img/'+s[0]+'.png';IMG[s[0]]=im})));
  await document.fonts.load('60px F');
  return Math.ceil(T.total*FPS);
}
// ---------- effect helpers (image coordinates) ----------
function glow(x,y,r,col,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col.replace('A',a));gr.addColorStop(1,col.replace('A',0));g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function flicker(t,s){return 0.75+0.25*Math.sin(t*23+s)*Math.sin(t*7.3+s*2)+0.1*rnd(Math.floor(t*20)+s)}
function embers(t,n,x0,x1,y0,y1,seed){for(let i=0;i<n;i++){const sp=40+60*rnd(i+seed),life=(y1-y0)/sp;const ph=((t+rnd(i*3+seed)*life)%life);
  const x=x0+(x1-x0)*rnd(i*7+seed)+18*Math.sin(t*2+i);const y=y1-ph*sp;const a=1-ph/life;
  g.fillStyle=`rgba(255,${150+80*rnd(i)|0},60,${a})`;g.beginPath();g.arc(x,y,1.5+2*rnd(i*5+seed),0,7);g.fill()}}
function smoke(t,n,x,y,spread,seed){for(let i=0;i<n;i++){const life=6,ph=(t+rnd(i+seed)*life)%life,k=ph/life;
  const px=x+(rnd(i*9+seed)-.5)*spread+k*60*Math.sin(i),py=y-k*260,r=30+k*90;
  g.fillStyle=`rgba(25,22,22,${0.35*(1-k)*Math.min(1,k*5)})`;g.beginPath();g.arc(px,py,r,0,7);g.fill()}}
function sparks(t,x,y,col,n,seed){const fr=Math.floor(t*24);for(let i=0;i<n;i++){const a=rnd(fr*31+i+seed)*6.28,l=10+40*rnd(fr*17+i);
  g.strokeStyle=col;g.lineWidth=2.5;g.beginPath();let px=x,py=y;g.moveTo(px,py);for(let s=0;s<3;s++){px+=Math.cos(a+(rnd(fr+i+s)-.5))*l/3;py+=Math.sin(a+(rnd(fr*3+i+s)-.5))*l/3;g.lineTo(px,py)}g.stroke()}}
function fireLick(t,x,y,w,h,seed){for(let i=0;i<14;i++){const k=rnd(i+seed),ph=(t*1.5+k)%1;const px=x+(rnd(i*4+seed)-.5)*w,py=y-ph*h;
  glow(px,py,(1-ph)*w*0.35+8,'rgba(255,140,30,A)',0.35*(1-ph))}}
// ---------- per-scene effects ----------
const FX={
 '01':(t,d)=>{const f=flicker(t,1);glow(390,300,330*f,'rgba(255,150,40,A)',0.55);fireLick(t,380,360,260,220,1);
   for(let i=0;i<40;i++){const k=clamp(t*1.6-rnd(i)*0.3,0,1.4);if(k<=0)continue;const a=rnd(i*3)*6.28,dist=k*k*900;
     const x=390+Math.cos(a)*dist*0.9,y=300+Math.sin(a)*dist*0.7+k*k*300,s=6+k*45*rnd(i*7);
     g.save();g.translate(x,y);g.rotate(t*8*rnd(i)+i);g.fillStyle=`rgba(220,240,255,${clamp(1.3-k,0,0.9)})`;g.strokeStyle='rgba(0,0,0,.6)';g.lineWidth=2;
     g.beginPath();g.moveTo(0,-s);g.lineTo(s*0.6,s*0.7);g.lineTo(-s*0.5,s*0.4);g.closePath();g.fill();g.stroke();g.restore()}
   embers(t,25,200,600,100,500,1)},
 '02':(t,d)=>{glow(300,330,170*flicker(t,2),'rgba(255,140,30,A)',0.6);fireLick(t,300,350,120,160,2);smoke(t,10,300,250,120,2);embers(t,20,200,420,120,380,2)},
 '03':(t,d)=>{smoke(t,14,480,330,300,3);glow(560,600,120*flicker(t,3),'rgba(255,140,30,A)',0.5);fireLick(t,560,610,70,90,3);
   for(let i=0;i<2;i++){const x=520+i*60+((t*25)%60);glow(x,640,30,'rgba(255,250,200,A)',0.6)}embers(t,18,350,700,250,700,3)},
 '04':(t,d)=>{g.fillStyle=`rgba(255,120,30,${0.10*flicker(t,4)})`;g.fillRect(0,0,IW,IH);glow(250,300,200*flicker(t,5),'rgba(255,140,40,A)',0.35);embers(t,12,100,700,200,1300,4)},
 '05':(t,d)=>{const ox=590,oy=340,sw=Math.sin(t*1.8);const ex=150+300*(0.5+0.5*sw),ey=700+120*Math.cos(t*1.3);
   g.save();g.globalCompositeOperation='lighter';g.strokeStyle='rgba(255,40,40,.85)';g.lineWidth=7;g.beginPath();g.moveTo(ox,oy);g.lineTo(ex,ey);g.stroke();
   g.strokeStyle='rgba(255,120,120,.35)';g.lineWidth=26;g.stroke();g.restore();glow(ex,ey,90,'rgba(255,30,30,A)',0.6);glow(ox,oy,50*(0.8+0.4*Math.sin(t*20)),'rgba(255,50,50,A)',0.9);
   glow(200,400,220*flicker(t,6),'rgba(255,140,30,A)',0.4);embers(t,20,100,700,200,900,5)},
 '06':(t,d)=>{for(let i=0;i<26;i++){const a=rnd(i)*6.28,r0=200+((t*900+rnd(i*5)*600)%600);g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=3;
   g.beginPath();g.moveTo(384+Math.cos(a)*r0,560+Math.sin(a)*r0);g.lineTo(384+Math.cos(a)*(r0+120),560+Math.sin(a)*(r0+120));g.stroke()}
   glow(420,200,200*flicker(t,7),'rgba(255,140,30,A)',0.5);fireLick(t,420,260,100,180,7);embers(t,30,250,600,100,900,7)},
 '07':(t,d)=>{glow(150,505,60*(0.7+0.5*Math.abs(Math.sin(t*4))),'rgba(255,30,30,A)',0.95);glow(150,505,180,'rgba(255,30,30,A)',0.25);embers(t,16,300,700,200,800,8)},
 '08':(t,d)=>{const k=clamp(t/1.6,0,1),x=290,y=560;glow(x,y,80+520*ease(k),'rgba(255,170,50,A)',0.9*(1-k*0.5));glow(x,y,60+240*ease(k),'rgba(255,240,180,A)',0.9*(1-k));
   g.strokeStyle=`rgba(255,230,180,${0.8*(1-k)})`;g.lineWidth=14*(1-k)+1;g.beginPath();g.arc(x,y,40+700*ease(k),0,7);g.stroke();
   for(let i=0;i<30;i++){const a=-rnd(i)*3.14,v=300+500*rnd(i*3),tt=Math.min(t,2.5);const px=x+Math.cos(a)*v*tt,py=y+Math.sin(a)*v*tt+300*tt*tt;
     g.fillStyle=`rgba(30,20,15,${clamp(1-t/2.5,0,1)})`;g.fillRect(px,py,8+10*rnd(i),6+8*rnd(i*2))}
   fireLick(t,x,y,220,420,9);smoke(t,16,x,y-200,260,9);embers(t,45,100,600,100,800,9)},
 '09':(t,d)=>{sparks(t,105,265,'rgba(150,220,255,.95)',6,1);glow(105,265,130*(0.6+0.6*rnd(Math.floor(t*24))),'rgba(80,170,255,A)',0.7);
   g.fillStyle=`rgba(80,160,255,${0.06*rnd(Math.floor(t*24)+3)})`;g.fillRect(0,0,IW,IH);embers(t,14,400,768,0,500,10)},
 '10':(t,d)=>{const on=t>0&&((t*3)%1)<0.5;glow(365,850,on?180:70,'rgba(255,40,40,A)',on?0.85:0.4);glow(365,850,on?60:25,'rgba(255,220,220,A)',0.9);
   sparks(t,365,850,'rgba(255,120,120,.7)',on?3:0,4);embers(t,14,400,768,0,500,11)},
 '11':(t,d)=>{sparks(t,170,330,'rgba(150,220,255,.95)',7,6);glow(170,330,150*(0.6+0.6*rnd(Math.floor(t*24)+9)),'rgba(80,170,255,A)',0.7);
   glow(330,500,60,'rgba(255,150,40,A)',0.25*flicker(t,8));embers(t,12,400,768,0,500,12)},
};
// ---------- camera per scene ----------
function shake(T0,A,tg){const l=tg-T0;if(l<0)return[0,0,0];const e=A*Math.exp(-l*5);return[e*Math.sin(47*l),e*Math.cos(39*l),e*0.002*Math.sin(31*l)]}
function camera(id,t,d,tg){let z=1.06,x=0,y=0,r=0;
  const hx=6*Math.sin(tg*1.3)+3*Math.sin(tg*3.1),hy=5*Math.sin(tg*1.7)+3*Math.cos(tg*2.7);x+=hx;y+=hy;r+=0.004*Math.sin(tg*0.9);
  const p=t/d;
  if(id=='01'){z=1.06+0.06*p;if(t>1.6){const k=ease((t-1.6)/1.0);y+=-260*k;r+=-0.18*k;z+=0.1*k}}
  if(id=='02'){const k=ease(t/1.5);r+=-0.15*(1-k);y+=-120*(1-k);z=1.12-0.04*p}
  if(id=='03'){z=1.04+0.12*p;y+=14*Math.abs(Math.sin(tg*5.5));x+=8*Math.sin(tg*2.75)}
  if(id=='04'){z=1.05+0.14*ease(p)}
  if(id=='05'){z=1.05+0.08*p;if(t>d-1.1){const k=ease((t-(d-1.1))/1.1);r+=0.12*k;x+=-200*k}}
  if(id=='06'){z=1.12+0.05*Math.sin(tg*11);x+=22*Math.sin(tg*11);y+=34*Math.abs(Math.sin(tg*11));r+=0.025*Math.sin(tg*11)}
  if(id=='07'){const step=Math.floor(t*2.4),f=ease((t*2.4)%1);y+=(step+f)*55-80;x+=12*Math.sin(step*2+f*3);z=1.1}
  if(id=='08'){z=1.04+0.05*p}
  if(id=='09'){z=1.03+0.12*ease(p)}
  if(id=='10'){z=1.1+0.06*p}
  if(id=='11'){z=1.05+0.28*ease(p)+0.02*Math.max(0,Math.sin(tg*7.85))}
  for(const [t0,A] of T.shakes){const s=shake(t0,A*1.6,tg);x+=s[0];y+=s[1];r+=s[2]}
  return {z,x,y,r};
}
function wrap(txt,n){const w=txt.split(' '),out=[];let cur='';for(const x of w){if((cur+' '+x).trim().length>n){out.push(cur.trim());cur=x}else cur+=' '+x}if(cur.trim())out.push(cur.trim());return out}
function text(s,y,size,col,bw){g.font=`${size}px F`;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=bw;g.strokeStyle='#000';g.strokeText(s,W/2,y);g.fillStyle=col;g.fillText(s,W/2,y)}
function render(f){const tg=f/FPS;g.fillStyle='#000';g.fillRect(0,0,W,H);
  const sc=T.scenes.find(s=>tg>=s[1]&&tg<s[2]);
  if(sc){const [id,st,en]=sc,t=tg-st,d=en-st,c=camera(id,t,d,tg);const base=H/IH*1.08*c.z;
    g.save();g.translate(W/2+c.x,H/2+c.y);g.rotate(c.r);g.scale(base,base);g.translate(-IW/2,-IH/2);
    if(id=='06'){g.globalAlpha=0.35;g.drawImage(IMG[id],0,-14);g.globalAlpha=1}
    g.drawImage(IMG[id],0,0);FX[id](t,d);g.restore();
    if(t<0.12&&st>0){g.fillStyle=`rgba(0,0,0,${1-t/0.12})`;g.fillRect(0,0,W,H)}
  }
  for(const [t0,d] of T.flashes){if(tg>=t0&&tg<t0+d*2.5){g.fillStyle=`rgba(255,240,220,${0.8*(1-(tg-t0)/(d*2.5))})`;g.fillRect(0,0,W,H)}}
  const vg=g.createRadialGradient(W/2,H/2,W*0.45,W/2,H/2,H*0.68);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.6)');g.fillStyle=vg;g.fillRect(0,0,W,H);
  for(const [a,b,txt,radio] of T.subs){if(tg>=a&&tg<=b+0.15){const ls=wrap(txt,22),pop=1+0.12*Math.max(0,1-(tg-a)/0.12);
     ls.forEach((l,j)=>text(l,H*0.66+j*82,62*pop,radio?'#FFE14D':'#fff',14))}}
  const end=T.scenes[T.scenes.length-1][2];
  if(tg>end+0.2)text('TEIL 2 MORGEN',H*0.44,100,'#FF3B30',12);
  if(tg>end+0.8){text('Glaubt ihr Lea?',H*0.52,62,'#fff',10);text('Schreibt es in die Kommentare',H*0.565,46,'#fff',8)}
}
</script></body></html>
